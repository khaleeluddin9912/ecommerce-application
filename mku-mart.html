<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKU MART | Online Shopping</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#131921;--blue:#243b65;--yellow:#ffd814;--orange:#ff9900;
  --bg:#eaeded;--surface:#fff;--surface2:#f5f7fa;--text:#172337;--muted:#64748b;--border:#e3e7ec;
  --link:#1266a8;--danger:#cc2638;--ok:#1a8f4c;--l1:92%;--l2:82%;--shadow:0 8px 24px #17233716;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1319;--surface:#18202a;--surface2:#202a36;--text:#e8edf3;--muted:#98a5b6;--border:#2c3745;--link:#6cb6ff;--l1:26%;--l2:18%;--shadow:0 8px 24px #0008}
}
:root[data-theme="dark"]{--bg:#0e1319;--surface:#18202a;--surface2:#202a36;--text:#e8edf3;--muted:#98a5b6;--border:#2c3745;--link:#6cb6ff;--l1:26%;--l2:18%;--shadow:0 8px 24px #0008}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff990033}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
h1,h2,h3{line-height:1.2}
.wrap{width:min(1240px,94%);margin:0 auto}
main{flex:1;padding-bottom:30px}

/* header */
.topbar{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.topbar .wrap{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.logo span{color:var(--orange)}
.search{position:relative;flex:1;min-width:220px;display:flex;height:42px;border-radius:8px;overflow:visible}
.search input{border:0;border-radius:8px 0 0 8px;height:42px;color:#172337;background:#fff}
.search button{background:var(--orange);border:0;padding:0 18px;border-radius:0 8px 8px 0;font-size:18px;color:#131921}
.sugg{position:absolute;top:46px;left:0;right:0;background:var(--surface);color:var(--text);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:40;border:1px solid var(--border)}
.sugg.open{display:block}
.sugg a{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:14px}
.sugg a:hover{background:var(--surface2)}
.hbtn{background:none;border:0;color:#fff;font-size:12px;text-align:left;white-space:nowrap;line-height:1.25;position:relative;padding:4px 6px;border-radius:6px}
.hbtn:hover{outline:1px solid #fff6}
.hbtn strong{display:block;font-size:14px}
.badge{background:var(--orange);color:#131921;border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:3px}
.subnav{background:var(--blue);color:#fff}
.subnav .wrap{display:flex;gap:22px;padding:10px 0;overflow-x:auto;white-space:nowrap;font-size:14px}
.subnav a:hover,.subnav a.on{color:var(--yellow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:22px;padding:10px 18px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--border);transition:.15s}
.btn:hover{filter:brightness(.96)}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#172337}
.btn.y:hover{background:#f7b900}
.btn.o{background:var(--orange);border-color:var(--orange);color:#131921}
.btn.d{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--link);background:none;border:0;font-size:13px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

/* layout bits */
.panel{background:var(--surface);border-radius:12px;padding:22px;margin-top:18px;border:1px solid var(--border)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px}
.sec-h h2{font-size:22px}
.muted{color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);padding:16px 0 0}
.crumbs a{color:var(--link)}
.err{color:var(--danger);font-size:12px;display:block;min-height:0;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:8px}
.empty h3{color:var(--text);margin-bottom:6px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.tag.ok{background:#1a8f4c22;color:var(--ok);border-color:#1a8f4c55}
.tag.warn{background:#ff990022;color:#b86e00;border-color:#ff990066}
.tag.bad{background:#cc263822;color:var(--danger);border-color:#cc263855}

/* product visual */
.pimg{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 55% var(--l1)),hsl(var(--h) 50% var(--l2)));overflow:hidden}
.pimg span{font-size:var(--fs,76px);filter:drop-shadow(0 8px 8px #0003)}
.pimg img{width:100%;height:100%;object-fit:cover}

/* hero */
.hero{margin-top:18px;border-radius:14px;overflow:hidden;position:relative;min-height:280px;color:#fff}
.slide{position:absolute;inset:0;padding:42px 5%;display:flex;align-items:center;justify-content:space-between;gap:24px;opacity:0;visibility:hidden;transition:opacity .5s}
.slide.on{opacity:1;visibility:visible;position:relative;min-height:280px}
.slide h1{font-size:clamp(30px,4.5vw,52px);margin:10px 0 12px}
.slide p{max-width:480px;color:#e4edf8;line-height:1.7;margin-bottom:22px}
.slide .eyebrow{color:var(--yellow);font-weight:700;font-size:13px}
.slide .art{font-size:clamp(70px,12vw,140px);filter:drop-shadow(0 14px 14px #0005)}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#fff6}
.dots button.on{background:#fff;width:22px;border-radius:6px}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.benefit{background:var(--surface);padding:16px;border-radius:10px;display:flex;gap:12px;align-items:center;border:1px solid var(--border)}
.benefit .e{font-size:26px}
.benefit strong{display:block;font-size:14px}
.benefit small{color:var(--muted);font-size:12px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{text-align:center;padding:18px 8px;border:1px solid var(--border);border-radius:12px;transition:.15s;display:block}
.cat:hover{border-color:var(--orange);background:var(--surface2)}
.cat .i{font-size:36px;margin-bottom:8px}
.cat strong{font-size:13px}
.deal-band{background:linear-gradient(110deg,#ffe9c4,#ffd28a);color:#3d2a0a;border-radius:12px;padding:26px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.deal-band h2{font-size:24px;margin-bottom:6px}
.timer{display:flex;gap:8px;margin-top:12px}
.timer div{background:#131921;color:#fff;border-radius:8px;padding:6px 10px;text-align:center;min-width:54px;font-weight:800;font-size:20px}
.timer small{display:block;font-size:10px;font-weight:500;opacity:.8}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;background:var(--surface);transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cimg{display:block;height:180px;position:relative}
.deal{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:5px;z-index:1}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#fffd;color:#cc2638;font-size:19px;display:grid;place-items:center}
.heart.on{background:#cc2638;color:#fff}
.cinfo{padding:14px;display:flex;flex-direction:column;flex:1;gap:4px}
.cinfo .brand{font-size:11px;color:var(--muted)}
.cinfo h3{font-size:14px;min-height:40px;font-weight:600}
.cinfo h3:hover{color:var(--link)}
.price{font-size:20px;font-weight:800}
.price del{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.low{font-size:12px;color:#b86e00}
.oos{font-size:12px;color:var(--danger);font-weight:600}
.cinfo .btn{margin-top:auto}
.stars{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.st{background:linear-gradient(90deg,#f5a000 var(--r),var(--border) var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px;letter-spacing:1px}

/* shop */
.shop{display:grid;grid-template-columns:240px 1fr;gap:18px;margin-top:16px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:sticky;top:calc(130px + env(safe-area-inset-top,0px))}
.filters h4{font-size:14px;margin:14px 0 8px}
.filters h4:first-child{margin-top:0}
.filters .opt{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:6px;font-weight:400;cursor:pointer}
.filters .opt input{width:auto}
.prange{display:flex;gap:6px;align-items:center}
.prange input{padding:7px 8px;font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{width:auto}
.fbtn{display:none}
.pager{display:flex;gap:6px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.pager button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:30px}
.gal-main{height:420px;border-radius:14px;overflow:hidden;--fs:190px;border:1px solid var(--border)}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumb{width:76px;height:76px;border-radius:10px;overflow:hidden;border:2px solid var(--border);--fs:36px;padding:0;background:none}
.thumb.on{border-color:var(--orange)}
.pdp h1{font-size:26px;margin:4px 0 8px}
.pdp .price{font-size:30px}
.save{color:var(--ok);font-weight:700;font-size:14px}
.swatches{display:flex;gap:10px;margin:8px 0 16px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--border);background:hsl(var(--h) 65% 50%)}
.sw.on{box-shadow:0 0 0 2px var(--orange)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--surface)}
.qty button{width:34px;height:34px;border:0;background:var(--surface2);font-size:18px;line-height:1}
.qty input{width:46px;border:0;text-align:center;padding:6px 0;border-radius:0}
.qty .n{min-width:36px;text-align:center;font-weight:700}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pin{display:flex;gap:8px;margin-top:6px;max-width:340px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted)}
.tabs a.on{border-color:var(--orange);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}
.review{padding:14px 0;border-bottom:1px solid var(--border)}
.review:last-child{border:0}

/* cart & checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.line{display:grid;grid-template-columns:90px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.line:last-child{border:0}
.line .pic{width:90px;height:90px;border-radius:10px;overflow:hidden;--fs:42px}
.summary{position:sticky;top:calc(130px + env(safe-area-inset-top,0px))}
.sumrow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.sumrow.t{font-size:19px;font-weight:800;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.sumrow .g{color:var(--ok)}
.coupon{display:flex;gap:8px;margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;border:1px dashed var(--orange);color:var(--text);padding:3px 8px;border-radius:6px;background:#ff990014;cursor:pointer}
.paybox{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.paybox>label{display:flex;gap:10px;align-items:center;padding:12px 14px;margin:0;cursor:pointer;font-size:14px}
.paybox>label input{width:auto}
.paybox .pane{display:none;padding:0 14px 14px}
.paybox.on{border-color:var(--orange)}
.paybox.on .pane{display:block}
.addr-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.addr{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;cursor:pointer;background:var(--surface)}
.addr.on{border-color:var(--orange);background:#ff99000f}

/* orders */
.track{display:flex;justify-content:space-between;margin:20px 0 6px;position:relative}
.track::before{content:"";position:absolute;top:13px;left:6%;right:6%;height:3px;background:var(--border)}
.tstep{position:relative;text-align:center;flex:1;font-size:12px;color:var(--muted)}
.tstep i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--border);margin:0 auto 6px;position:relative;font-style:normal;font-size:13px;color:#fff}
.tstep.done{color:var(--text)}
.tstep.done i{background:var(--ok)}
.ocard{border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--surface)}
.ohead{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;background:var(--surface2);padding:12px 16px;font-size:13px}
.ohead b{display:block;font-size:14px}
.obody{padding:14px 16px}
.oitem{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.oitem .pic{width:52px;height:52px;border-radius:8px;overflow:hidden;--fs:26px;flex:none}

/* account */
.acct{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px}
.side a{display:block;padding:10px 12px;border-radius:8px;font-size:14px}
.side a:hover{background:var(--surface2)}
.side a.on{background:var(--navy);color:#fff}
.authbox{max-width:430px;margin:36px auto}
.hint{background:#ffd81422;border:1px dashed var(--orange);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:16px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat small{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:24px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:46px;background:linear-gradient(var(--orange),#e07b00);border-radius:6px 6px 0 0;min-height:3px}
.athumb{width:44px;height:44px;border-radius:8px;overflow:hidden;--fs:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between}
.tools input{max-width:300px}

/* modal / toast */
.modal{position:fixed;inset:0;background:#000a;z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:22px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.mbox h3{margin-bottom:14px;font-size:19px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s ease;border-left:4px solid var(--ok)}
.toast.bad{border-color:var(--danger)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.proc{position:fixed;inset:0;background:#000b;z-index:90;display:grid;place-items:center;color:#fff;text-align:center}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #fff4;border-top-color:var(--orange);margin:0 auto 14px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

footer{background:var(--navy);color:#fff;margin-top:30px;padding:34px 0 22px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:24px}
footer h4{font-size:14px;margin-bottom:10px}
footer a{display:block;color:#bdc7d6;font-size:13px;margin-bottom:6px}
footer a:hover{color:#fff}
footer p{color:#bdc7d6;font-size:13px}
footer input{color:#172337}
.copy{border-top:1px solid #ffffff22;margin-top:22px;padding-top:16px;text-align:center;color:#8f9db0;font-size:12px}

@media (max-width:980px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(3,1fr)}
  .benefits,.stats{grid-template-columns:repeat(2,1fr)}
  .shop{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .filters.open{display:block}
  .fbtn{display:inline-flex}
  .pdp,.two,.acct{grid-template-columns:1fr}
  .summary{position:static}
  .fgrid{grid-template-columns:1fr 1fr}
  .side{display:flex;overflow-x:auto}
  .side a{white-space:nowrap}
}
@media (max-width:560px){
  .topbar .wrap{gap:10px}
  .search{order:5;flex-basis:100%}
  .hbtn.acc small{display:none}
  .grid2{grid-template-columns:1fr}
  .slide{padding:26px 22px}.slide .art{font-size:64px}
  .pgrid{gap:10px}.cimg{height:130px}.pimg span{--fs:54px}
  .line{grid-template-columns:70px 1fr}.line .pic{width:70px;height:70px}.line>:last-child{grid-column:2}
  .panel{padding:15px}
  .gal-main{height:300px;--fs:140px}
  .track{font-size:10px}
  .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .topbar,.subnav,footer,.noprint,#toasts{display:none!important}
  body{background:#fff;color:#000}
  .panel,.ocard{border:1px solid #ccc}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a href="#/" class="logo">MKU<span>MART.</span></a>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" type="search" placeholder="Search for products, brands and more..." aria-label="Search products">
      <button type="submit" aria-label="Search">⌕</button>
      <div class="sugg" id="sugg"></div>
    </form>
    <button class="hbtn" data-act="theme" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
    <a class="hbtn acc" id="hAcc" href="#/login"><small>Hello, guest</small><strong>Sign in</strong></a>
    <a class="hbtn" href="#/orders"><small>Returns</small><strong>& Orders</strong></a>
    <a class="hbtn" href="#/wishlist">♡ Wishlist<span class="badge" id="hWish">0</span></a>

function addToCart(id,qty=1,ci=0){
  const p=byId(id);if(!p||p.stock<1){toast('This item is out of stock',1);return false}
  const key=id+'|'+ci,l=cart.find(x=>x.key===key);
  const have=cart.filter(x=>x.id===id).reduce((s,x)=>s+x.qty,0);
  if(have+qty>p.stock){toast(`Only ${p.stock} available in stock`,1);return false}
  if(l)l.qty+=qty;else cart.push({key,id,ci,qty});
  saveCart();return true;
}
function totals(){
  const L=cart.map(l=>({...l,p:byId(l.id)})).filter(l=>l.p);
  const sub=L.reduce((s,l)=>s+l.p.price*l.qty,0);
  const c=coupon?db.coupons.find(x=>x.code===coupon&&x.active):null;
  let disc=0,free=false,cErr='';
  if(c){if(sub<c.min)cErr=`Add ${fmt(c.min-sub)} more to use ${c.code}`;
    else if(c.type==='percent')disc=Math.min(Math.round(sub*c.value/100),c.max||1e9);
    else if(c.type==='flat')disc=Math.min(c.value,sub);else free=true}
  const after=sub-disc,ship=(sub===0||after>=499||free)?0:49;
  return {L,sub,disc,ship,c:cErr?null:c,cErr,tax:Math.round(after*18/118),total:after+ship,count:L.reduce((s,l)=>s+l.qty,0)};
}

    const show=n=>{i=n;sl.forEach((s,k)=>s.classList.toggle('on',k===n));dots.forEach((d,k)=>d.classList.toggle('on',k===n))};
    window._slide=show;
    timers.push(setInterval(()=>show((i+1)%sl.length),5500));
    const tm=$('#timer');
    if(tm){const tick=()=>{const e=new Date();e.setHours(23,59,59,999);let s=Math.max(0,Math.floor((e-new Date())/1000));
      const v=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0'));
      $$('div',tm).forEach((d,k)=>d.firstChild.textContent=v[k])};tick();timers.push(setInterval(tick,1000))}
  }};
};

/* ---------- SHOP ---------- */
routes.shop=r=>{
  const q=r.q,cat=q.get('cat')||'',text=(q.get('q')||'').trim().toLowerCase(),sort=q.get('sort')||'rel';
  const min=+q.get('min')||0,max=+q.get('max')||0,rate=+q.get('rate')||0,stock=q.get('stock')==='1',page=Math.max(1,+q.get('page')||1),PER=8;
  let list=db.products.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(text){const hay=(p.name+' '+p.brand+' '+p.category+' '+p.desc).toLowerCase();if(!text.split(/\s+/).every(w=>hay.includes(w)))return false}
    if(min&&p.price<min)return false;if(max&&p.price>max)return false;
    if(rate&&p.rating<rate)return false;if(stock&&p.stock<1)return false;return true});
  const sorters={rel:(a,b)=>b.count-a.count,pl:(a,b)=>a.price-b.price,ph:(a,b)=>b.price-a.price,rate:(a,b)=>b.rating-a.rating,disc:(a,b)=>off(b)-off(a),new:(a,b)=>b.id-a.id};
  list.sort(sorters[sort]||sorters.rel);
  const pages=Math.max(1,Math.ceil(list.length/PER)),pg=Math.min(page,pages),slice=list.slice((pg-1)*PER,pg*PER);
  const pager=pages>1?`<div class="pager">${Array.from({length:pages},(_,i)=>`<button class="${i+1===pg?'on':''}" data-act="page" data-p="${i+1}">${i+1}</button>`).join('')}</div>`:'';
  return {title:cat||'Shop',html:`
  <div class="crumbs"><a href="#/">Home</a> / Shop${cat?' / '+esc(cat):''}${text?` / results for "${esc(q.get('q'))}"`:''}</div>
  <div class="shop"><aside class="filters" id="filters">
    <h4>Category</h4>
    <label class="opt"><input type="radio" name="cat" data-filter="cat" value="" ${!cat?'checked':''}> All</label>
    ${CATS.map(c=>`<label class="opt"><input type="radio" name="cat" data-filter="cat" value="${c.n}" ${cat===c.n?'checked':''}> ${c.n}</label>`).join('')}
    <h4>Price (₹)</h4>
    <div class="prange"><input type="number" min="0" placeholder="Min" id="fmin" value="${min||''}" aria-label="Minimum price"><span>–</span><input type="number" min="0" placeholder="Max" id="fmax" value="${max||''}" aria-label="Maximum price"></div>
    <button class="btn sm block" style="margin-top:8px" data-act="price">Apply price</button>
    <h4>Customer rating</h4>
    ${[0,4,3].map(v=>`<label class="opt"><input type="radio" name="rate" data-filter="rate" value="${v}" ${rate===v?'checked':''}> ${v?v+'★ & up':'Any'}</label>`).join('')}
    <h4>Availability</h4>
    <label class="opt"><input type="checkbox" data-filter="stock" ${stock?'checked':''}> In stock only</label>
    <button class="btn sm block" style="margin-top:14px" data-act="clearf">Clear all filters</button>
  </aside>
  <section><div class="toolbar"><div><strong>${list.length}</strong> product${list.length!==1?'s':''} found</div>
    <div style="display:flex;gap:8px;align-items:center"><button class="btn sm fbtn" data-act="togglef">Filters</button>
    <select data-filter="sort" aria-label="Sort by">${[['rel','Most popular'],['pl','Price: low to high'],['ph','Price: high to low'],['rate','Top rated'],['disc','Biggest discount'],['new','Newest']].map(o=>`<option value="${o[0]}" ${sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
    ${slice.length?`<div class="pgrid">${slice.map(card).join('')}</div>${pager}`:emptyBox('🔍','No products match','Try a different search or clear some filters.','<button class="btn y" data-act="clearf">Clear filters</button>')}
  </section></div>`,
  after(){const s=$('#q');s.value=q.get('q')||''}};
};
function setParams(upd){
  const r=parse(),q=new URLSearchParams(r.q);
  for(const k in upd){const v=upd[k];if(v===''||v==null||v===0)q.delete(k);else q.set(k,v)}
  if(!('page' in upd))q.delete('page');
  keepScroll=true;go('#/shop'+(q.toString()?'?'+q:''));
}

function placeOrder(f){
  const t=totals(),u=me(),d=fd(f),errs={};
  let addr;
  if(d.addrid&&d.addrid!=='new'){addr=(u.addresses||[]).find(a=>a.id===d.addrid)}
  else{
    if(!d.name||d.name.trim().length<2)errs.name='Enter your full name';
    if(!V.phone(d.phone||''))errs.phone='Enter a valid 10-digit mobile number';
    if(!d.line||d.line.trim().length<5)errs.line='Enter your address';
    if(!d.city||d.city.trim().length<2)errs.city='Enter your city';
    if(!V.pin(d.pin||''))errs.pin='Enter a valid 6-digit pincode';
  }
  let label='';
  if(d.pay==='upi'){if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(d.upi||''))errs.upi='Enter a valid UPI ID like name@bank';label=`UPI (${d.upi})`}
  if(d.pay==='card'){
    const n=(d.cardno||'').replace(/\s/g,'');
    if(!/^\d{13,19}$/.test(n)||!luhn(n))errs.cardno='Enter a valid card number';
    if(!d.cardname||d.cardname.trim().length<2)errs.cardname='Enter the name on the card';
    const m=/^(\d{2})\/(\d{2})$/.exec(d.exp||'');
    if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())errs.exp='Enter a valid future expiry';
    if(!/^\d{3}$/.test(d.cvv||''))errs.cvv='Enter the 3-digit CVV';
    label=`Card ending ${n.slice(-4)}`;
  }
  if(d.pay==='net')label=`Net banking (${d.bank})`;
  if(d.pay==='cod')label='Cash on delivery';
  if(!setErr(f,errs)){if(!errs.name&&!errs.phone&&!errs.line&&!errs.city&&!errs.pin)return;$('#addrform').hidden=false;setErr(f,errs);return}
  if(!addr){addr={id:uid(),name:d.name.trim(),phone:d.phone,line:d.line.trim(),city:d.city.trim(),state:d.state,pin:d.pin};
    if(d.saveaddr){u.addresses=u.addresses||[];u.addresses.push(addr)}}
  // stock re-check
  for(const l of t.L){if(l.p.stock<l.qty){toast(`${l.p.name}: only ${l.p.stock} left. Update your cart.`,1);return}}
  $('#modal').innerHTML='<div class="proc"><div><div class="spin"></div><strong>Processing your payment…</strong><p style="font-size:13px;opacity:.8;margin-top:4px">Please do not close this page</p></div></div>';
  setTimeout(()=>{
    const cod=d.pay==='cod'?40:0,now=Date.now();
    const day=new Date().toISOString().slice(2,10).replace(/-/g,'');
    const o={id:'MKU'+day+String(Math.floor(Math.random()*9000)+1000),uid:u.id,address:addr,payment:{method:d.pay,label},
      items:t.L.map(l=>({pid:l.p.id,name:l.p.name,icon:l.p.icon,hue:(colorsOf(l.p)[l.ci]||{}).h??l.p.hue,image:l.p.image||'',color:(colorsOf(l.p)[l.ci]||{}).n||'',price:l.p.price,qty:l.qty})),
      sub:t.sub,discount:t.disc,shipping:t.ship,cod,total:t.total+cod,coupon:t.c?t.c.code:'',status:'Placed',history:[{s:'Placed',t:now}],created:now,eta:now+4*864e5};
    t.L.forEach(l=>{l.p.stock-=l.qty});
    db.orders.push(o);save();
    cart=[];coupon='';LS.set('mku_coupon','');saveCart();
    closeModal();go('#/success/'+o.id);
  },1400);
}

/* ---------- form handlers ---------- */
const forms={
  async login(f){
    const d=fd(f),errs={};
    if(!V.email(d.email))errs.email='Enter a valid email address';
    if(!d.password)errs.password='Enter your password';
    if(!setErr(f,errs))return;
    const u=db.users.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase());
    if(!u||u.pass!==await sha(d.password)){setErr(f,{password:'Incorrect email or password'});return}
    sessionId=u.id;LS.set('mku_session',sessionId);toast('Welcome back, '+u.name.split(' ')[0]);
    go(d.next||(u.role==='admin'?'#/admin/dashboard':'#/'));updateHeader();
  },
  async signup(f){
    const d=fd(f),errs={};
    if(!d.name||d.name.trim().length<2)errs.name='Enter your full name';
    if(!V.email(d.email))errs.email='Enter a valid email address';
    else if(db.users.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase()))errs.email='An account with this email already exists';
    if(!V.phone(d.phone))errs.phone='Enter a valid 10-digit mobile number';
    if(!d.password||d.password.length<6)errs.password='Use at least 6 characters';
    if(!setErr(f,errs))return;
    const u={id:'u_'+uid(),name:d.name.trim(),email:d.email.trim(),phone:d.phone,role:'user',pass:await sha(d.password),addresses:[],created:Date.now()};
    db.users.push(u);save();sessionId=u.id;LS.set('mku_session',sessionId);toast('Account created. Welcome!');go('#/');updateHeader();
  },
  async forgot(f){
    const d=fd(f),errs={};
    if(!V.email(d.email))errs.email='Enter a valid email address';
    if(!d.password||d.password.length<6)errs.password='Use at least 6 characters';
    if(!setErr(f,errs))return;
    const u=db.users.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase());
    if(!u){setErr(f,{email:'No account found with this email'});return}
    u.pass=await sha(d.password);save();toast('Password updated. Please sign in.');go('#/login');
  },
  profile(f){
    const d=fd(f),errs={};
    if(!d.name||d.name.trim().length<2)errs.name='Enter your full name';
    if(!V.phone(d.phone))errs.phone='Enter a valid 10-digit mobile number';
    if(!setErr(f,errs))return;
    const u=me();u.name=d.name.trim();u.phone=d.phone;save();updateHeader();toast('Profile saved');
  },
  async password(f){
    const d=fd(f),errs={},u=me();
    if(u.pass!==await sha(d.old||''))errs.old='Current password is incorrect';
    if(!d.password||d.password.length<6)errs.password='Use at least 6 characters';
    if(!setErr(f,errs))return;
    u.pass=await sha(d.password);save();f.reset();toast('Password updated');
  },
  addr(f){
    const d=fd(f),errs={};
    if(!d.name||d.name.trim().length<2)errs.name='Enter a name';
    if(!V.phone(d.phone))errs.phone='Enter a valid 10-digit number';
    if(!d.line||d.line.trim().length<5)errs.line='Enter the address';
    if(!d.city||d.city.trim().length<2)errs.city='Enter the city';
    if(!V.pin(d.pin))errs.pin='Enter a valid 6-digit pincode';
    if(!setErr(f,errs))return;
    const u=me();u.addresses=u.addresses||[];u.addresses.push({id:uid(),name:d.name.trim(),phone:d.phone,line:d.line.trim(),city:d.city.trim(),state:d.state,pin:d.pin});
    save();closeModal();toast('Address saved');render();
  },
  coupon(f){
    const code=(fd(f).code||'').trim().toUpperCase();
    if(!code){toast('Enter a coupon code',1);return}
    const c=db.coupons.find(x=>x.code===code&&x.active);
    if(!c){toast('This coupon code is not valid',1);return}
    const t=totals();if(t.sub<c.min){toast(`Add ${fmt(c.min-t.sub)} more to use ${c.code}`,1);return}
    coupon=code;LS.set('mku_coupon',code);toast(`${code} applied`);render();
  },
  review(f){
    const d=fd(f),errs={};
    if(!d.title||d.title.trim().length<3)errs.title='Add a short headline';
    if(!d.text||d.text.trim().length<10)errs.text='Write at least 10 characters';
    if(!setErr(f,errs))return;
    const p=byId(d.pid),u=me();
    db.reviews.push({id:uid(),pid:p.id,uid:u.id,name:u.name,rating:+d.rating,title:d.title.trim(),text:d.text.trim(),date:Date.now()});
    p.rating=(p.rating*p.count+ +d.rating)/(p.count+1);p.count++;save();toast('Thanks for your review!');
    render().then?.(()=>{});setTimeout(()=>{const t=$('#tabrev');t&&t.click()},0);
  },
  checkout(f){placeOrder(f)},
  contact(f){
    const d=fd(f),errs={};
    if(!d.name||d.name.trim().length<2)errs.name='Enter your name';
    if(!V.email(d.email))errs.email='Enter a valid email';
    if(!d.msg||d.msg.trim().length<10)errs.msg='Write at least 10 characters';
    if(!setErr(f,errs))return;
    db.messages.push({name:d.name.trim(),email:d.email.trim(),msg:d.msg.trim(),date:Date.now()});save();f.reset();toast('Message sent. We will reply soon.');
  },
  newsletter(f){
    const e=(fd(f).email||'').trim();
    if(!V.email(e)){setErr(f,{email:'Enter a valid email'});return}
    if(db.subs.includes(e)){toast('You are already subscribed');return}
    db.subs.push(e);save();f.reset();setErr(f,{});toast('Subscribed. Thanks!');
  },
  newcoupon(f){
    const d=fd(f),errs={},code=(d.code||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{3,14}$/.test(code))errs.code='Use 3–14 letters or numbers';
    else if(db.coupons.some(c=>c.code===code))errs.code='This code already exists';
    if(d.type!=='ship'&&!(+d.value>0))errs.value='Enter a value above 0';
    if(d.type==='percent'&&+d.value>90)errs.value='Percent must be 90 or less';
    if(!setErr(f,errs))return;
    const v=+d.value||0,desc=d.type==='percent'?`${v}% off`:d.type==='flat'?`₹${v} off`:'Free delivery';
    db.coupons.push({code,type:d.type,value:v,max:d.type==='percent'?1e9:0,min:+d.min||0,desc:desc+(+d.min?` on orders above ₹${(+d.min).toLocaleString('en-IN')}`:''),active:true});
    save();toast('Coupon added');render();
  },
  product(f){
    const d=fd(f),errs={};
    if(!d.name||d.name.trim().length<3)errs.name='Enter a product name';
    if(!d.brand||!d.brand.trim())errs.brand='Enter a brand';
    if(!(+d.price>0))errs.price='Enter a price above 0';
    if(!(+d.mrp>0))errs.mrp='Enter the MRP';else if(+d.mrp<+d.price)errs.mrp='MRP must be at least the selling price';
    if(d.stock===''||+d.stock<0)errs.stock='Enter the stock quantity';
    if(!d.desc||d.desc.trim().length<10)errs.desc='Add a short description';
    if(!setErr(f,errs))return;
    const base={name:d.name.trim(),brand:d.brand.trim(),category:d.category,price:+d.price,mrp:+d.mrp,stock:Math.floor(+d.stock),icon:d.icon||'🎁',hue:+d.hue,desc:d.desc.trim(),featured:!!d.featured,image:d.image||''};
    if(d.id==='new'){db.products.push({...base,id:Math.max(0,...db.products.map(p=>p.id))+1,rating:4,count:0,specs:{Brand:base.brand,Category:base.category}});toast('Product added')}
    else{Object.assign(byId(d.id),base);toast('Product updated')}
    save();closeModal();render();
  }
};
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(f){e.preventDefault();forms[f.dataset.form](f);return}
  if(e.target.id==='searchForm'){e.preventDefault();const v=$('#q').value.trim();go('#/shop'+(v?'?q='+encodeURIComponent(v):''))}
});

/* ---------- click actions ---------- */
function cancelOrder(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  o.items.forEach(i=>{const p=byId(i.pid);if(p)p.stock+=i.qty});
  o.status='Cancelled';o.history.push({s:'Cancelled',t:Date.now()});save();toast('Order cancelled');render();
}
const acts={
  theme(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;LS.set('mku_theme',n)},
  slide(el){window._slide&&window._slide(+el.dataset.i)},
  wish(el){
    const id=+el.dataset.id,i=wish.indexOf(id);
    if(i<0){wish.push(id);toast('Added to wishlist')}else{wish.splice(i,1);toast('Removed from wishlist')}
    LS.set('mku_wish',wish);updateHeader();
    if(parse().parts[0]==='wishlist'||parse().parts[0]==='product'){keepScroll=true;render()}
    else $$(`.heart[data-id="${id}"]`).forEach(b=>{const on=wish.includes(id);b.classList.toggle('on',on);b.textContent=on?'♥':'♡'});
  },
  add(el){if(addToCart(+el.dataset.id)){toast('Added to cart');el.textContent='✓ Added';setTimeout(()=>{el.textContent='Add to Cart'},900)}},
  color(el){
    const s=window._pdp;s.ci=+el.dataset.i;const c=colorsOf(s.p)[s.ci];
    $('#gmain').innerHTML=pimg(s.p,c.h);$('#cname').textContent=c.n;
    $$('.sw').forEach((x,k)=>x.classList.toggle('on',k===s.ci));$$('.thumb').forEach((x,k)=>x.classList.toggle('on',k===s.ci));
  },
  pq(el){const s=window._pdp;s.qty=Math.min(Math.max(1,s.qty+ +el.dataset.d),Math.max(1,s.p.stock),10);$('#pqty').textContent=s.qty},
  addp(){const s=window._pdp;if(addToCart(s.p.id,s.qty,s.ci))toast(`Added ${s.qty} to cart`)},
  buyp(){const s=window._pdp;if(addToCart(s.p.id,s.qty,s.ci))go('#/checkout')},
  pin(){
    const v=$('#pin').value.trim(),o=$('#pinres');
    if(!V.pin(v)){o.innerHTML='<span class="err">Enter a valid 6-digit pincode</span>';return}
    const d=2+(+v[0]%4),dt=new Date(Date.now()+d*864e5);
    o.innerHTML=`<span style="color:var(--ok)">✓ Delivery to ${v} by ${dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}.</span> Cash on delivery available.`;
  },
  tab(el,e){e.preventDefault();$$('.tabs a',el.closest('.panel')).forEach(a=>a.classList.toggle('on',a===el));['t-desc','t-spec','t-rev'].forEach(id=>{const x=$('#'+id);if(x)x.hidden=id!==el.dataset.t})},
  toreviews(el,e){e.preventDefault();const t=$('#tabrev');if(t){t.click();$('#details').scrollIntoView({behavior:'smooth'})}},
  cq(el){
    const l=cart.find(x=>x.key===el.dataset.k),p=byId(l.id),d=+el.dataset.d;
    const others=cart.filter(x=>x.id===l.id&&x!==l).reduce((s,x)=>s+x.qty,0);
    if(d>0&&l.qty+others>=p.stock){toast(`Only ${p.stock} available in stock`,1);return}
    l.qty+=d;if(l.qty<1)cart=cart.filter(x=>x!==l);saveCart();keepScroll=true;render();
  },
  crm(el){cart=cart.filter(x=>x.key!==el.dataset.k);saveCart();keepScroll=true;render();toast('Item removed')},
  csave(el){const l=cart.find(x=>x.key===el.dataset.k);if(!wish.includes(l.id)){wish.push(l.id);LS.set('mku_wish',wish)}cart=cart.filter(x=>x!==l);saveCart();keepScroll=true;render();toast('Moved to wishlist')},
  clearcart(){confirmBox('This removes every item from your cart.',()=>{cart=[];saveCart();render()},'Empty cart')},
  usecode(el){const i=$('input[name=code]');i.value=el.dataset.code;forms.coupon(i.closest('form'))},
  rmcoupon(){coupon='';LS.set('mku_coupon','');keepScroll=true;render();toast('Coupon removed')},
  pickaddr(el){
    $$('.addr[data-act=pickaddr]').forEach(a=>a.classList.toggle('on',a===el));
    const f=el.closest('form');f.elements.addrid.value=el.dataset.id;$('#addrform').hidden=el.dataset.id!=='new';
  },
  cancelo(el){confirmBox('Do you want to cancel this order? Stock is released immediately.',()=>cancelOrder(el.dataset.id),'Cancel order')},
  print(){try{window.print()}catch(e){toast('Printing is not available here',1)}},
  logout(el,e){e.preventDefault();sessionId=null;LS.del('mku_session');toast('Signed out');go('#/');updateHeader()},
  addaddr(){addrModal()},
  deladdr(el){const u=me();u.addresses=u.addresses.filter(a=>a.id!==el.dataset.id);save();render();toast('Address deleted')},
  page(el){setParams({page:+el.dataset.p});},
  price(){setParams({min:+$('#fmin').value||0,max:+$('#fmax').value||0})},
  clearf(){keepScroll=true;go('#/shop')},
  togglef(){$('#filters').classList.toggle('open')},
  close(){closeModal()},
  mclose(el,e){if(e.target===el)closeModal()},
  editp(el){productModal(el.dataset.id==='new'?'new':+el.dataset.id)},
  delp(el){const p=byId(el.dataset.id);confirmBox(`Delete “${esc(p.name)}”? This cannot be undone.`,()=>{db.products=db.products.filter(x=>x.id!==p.id);cart=cart.filter(x=>x.id!==p.id);wish=wish.filter(x=>x!==p.id);LS.set('mku_wish',wish);save();saveCart();render();toast('Product deleted')},'Delete')},
  delc(el){db.coupons=db.coupons.filter(c=>c.code!==el.dataset.code);if(coupon===el.dataset.code){coupon='';LS.set('mku_coupon','')}save();render();toast('Coupon deleted')},
  vieworder(el){const o=db.orders.find(x=>x.id===el.dataset.id);modal(orderDetail(o,true)+'<div class="mfoot noprint"><button class="btn" data-act="close">Close</button></div>')},
  rmimg(){const h=$('input[name=image]');h.value='';$('#imgPrev').innerHTML='<div class="pimg" style="--h:210"><span>🎁</span></div>'},
  resetdb(){confirmBox('All products, users, orders and coupons return to the original demo data.',async()=>{['mku_cart','mku_wish','mku_coupon','mku_recent','mku_session'].forEach(k=>LS.del(k));db=await seed();save();cart=[];wish=[];coupon='';recent=[];sessionId=null;toast('Demo data restored');go('#/');updateHeader()},'Reset')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&acts[el.dataset.act]){acts[el.dataset.act](el,e)}
  if(!e.target.closest('#searchForm'))$('#sugg').classList.remove('open');
});

/* ---------- change/input handlers ---------- */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter){
    const k=t.dataset.filter;
    if(k==='stock')setParams({stock:t.checked?'1':''});else setParams({[k]:k==='sort'&&t.value==='rel'?'':t.value});
  }
  if(t.name==='pay'){$$('.paybox').forEach(b=>b.classList.toggle('on',b.dataset.pay===t.value));
    const tt=totals(),cod=t.value==='cod'?40:0;
    $('#sumbox').innerHTML=sumBox(tt,cod?`<div class="sumrow"><span>COD fee</span><span>${fmt(cod)}</span></div>`:'')+`<div class="sumrow t"><span>Total</span><span>${fmt(tt.total+cod)}</span></div>`}
  if(t.dataset.ostatus){
    const o=db.orders.find(x=>x.id===t.dataset.ostatus),s=t.value;if(!o||o.status===s)return;
    if(s==='Cancelled'){o.items.forEach(i=>{const p=byId(i.pid);if(p)p.stock+=i.qty})}
    o.status=s;o.history.push({s,t:Date.now()});save();toast(`Order ${o.id} marked ${s}`);render();
  }
  if(t.dataset.feat){byId(t.dataset.feat).featured=t.checked;save();toast('Updated')}
  if(t.dataset.ctog){db.coupons.find(c=>c.code===t.dataset.ctog).active=t.checked;save();toast('Updated')}
  if(t.id==='imgFile'&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const sc=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',.8);
      $('input[name=image]').value=url;$('#imgPrev').innerHTML=`<img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover">`};
      im.onerror=()=>toast('That file is not a valid image',1);im.src=rd.result};
    rd.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){
    const v=t.value.trim().toLowerCase(),s=$('#sugg');
    if(!v){s.classList.remove('open');return}
    const m=db.products.filter(p=>(p.name+' '+p.brand+' '+p.category).toLowerCase().includes(v)).slice(0,6);
    s.innerHTML=m.length?m.map(p=>`<a href="#/product/${p.id}"><span style="font-size:20px">${p.icon}</span><span>${esc(p.name)}</span><small class="muted" style="margin-left:auto">${p.category}</small></a>`).join(''):'<a href="#/shop?q='+encodeURIComponent(v)+'"><span class="muted">No suggestions. Press Enter to search.</span></a>';
    s.classList.add('open');
  }
  if(t.id==='asearch'){clearTimeout(window._at);window._at=setTimeout(()=>{keepScroll=true;go('#/admin/products'+(t.value?'?q='+encodeURIComponent(t.value):''))},350)}
  if(t.name==='cardno'){let v=t.value.replace(/\D/g,'').slice(0,16);t.value=v.replace(/(.{4})/g,'$1 ').trim()}
  if(t.name==='exp'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v}
  if(['phone','pin','cvv'].includes(t.name))t.value=t.value.replace(/\D/g,'');
});

/* ---------- boot ---------- */
const th=LS.get('mku_theme',null);if(th)document.documentElement.dataset.theme=th;
updateHeader();
render();
})();
</script>
